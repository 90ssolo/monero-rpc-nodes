<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="380" role="img" aria-label="Monero Remote Node Threat Model and Anti-Fake Verification Pipeline">
  <defs>
    <style>
      .bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 20px; fill: #0F172A; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #0F172A; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12.5px; fill: #334155; }
      .tag-green { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1; }
      .tag-green-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #166534; }
      .tag-amber { fill: #FEF3C7; stroke: #FDE68A; stroke-width: 1; }
      .tag-amber-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #92400E; }
      .tag-blue { fill: #DBEAFE; stroke: #93C5FD; stroke-width: 1; }
      .tag-blue-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #1E40AF; }
    </style>
  </defs>

  <rect class="bg" x="2" y="2" width="1096" height="376" rx="16"/>
  <text class="heading" x="32" y="42">Remote Node Security Boundaries &amp; How This Repository Filters Fake Nodes</text>

  <!-- Card 1 -->
  <g transform="translate(28, 66)">
    <rect class="card" x="0" y="0" width="332" height="284" rx="12"/>
    <rect x="0" y="0" width="332" height="6" rx="3" fill="#10B981"/>
    <text class="title" x="20" y="34">1. What a Remote Node CANNOT Do</text>
    <rect class="tag-green" x="20" y="48" width="215" height="24" rx="12"/>
    <text class="tag-green-txt" x="32" y="64">CRYPTOGRAPHICALLY PROTECTED</text>
    <text class="body" x="20" y="98">• Cannot steal or spend your XMR (spend</text>
    <text class="body" x="20" y="118">  keys never leave your wallet device).</text>
    <text class="body" x="20" y="144">• Cannot see your wallet balance or decode</text>
    <text class="body" x="20" y="164">  which stealth outputs belong to you.</text>
    <text class="body" x="20" y="190">• Cannot see recipient addresses or amounts</text>
    <text class="body" x="20" y="210">  hidden by RingCT and stealth addressing.</text>
    <text class="body" x="20" y="236">• Cannot forge confirmed blocks without</text>
    <text class="body" x="20" y="256">  matching RandomX proof-of-work difficulty.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(384, 66)">
    <rect class="card" x="0" y="0" width="332" height="284" rx="12"/>
    <rect x="0" y="0" width="332" height="6" rx="3" fill="#F59E0B"/>
    <text class="title" x="20" y="34">2. What a Malicious Node CAN Attempt</text>
    <rect class="tag-amber" x="20" y="48" width="215" height="24" rx="12"/>
    <text class="tag-amber-txt" x="32" y="64">METADATA &amp; AVAILABILITY RISKS</text>
    <text class="body" x="20" y="98">• Log client IP addresses &amp; timestamps when</text>
    <text class="body" x="20" y="118">  you sync or broadcast a transaction.</text>
    <text class="body" x="20" y="144">• Return inflated fee estimates via</text>
    <text class="body" x="20" y="164">  get_fee_estimate to make you overpay fees.</text>
    <text class="body" x="20" y="190">• Withhold blocks (eclipse/stall) so incoming</text>
    <text class="body" x="20" y="210">  payments appear missing until you switch.</text>
    <text class="body" x="20" y="236">• Serve stale/forked chain data or fake</text>
    <text class="body" x="20" y="256">  unconfirmed (0-conf) mempool transactions.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(740, 66)">
    <rect class="card" x="0" y="0" width="332" height="284" rx="12"/>
    <rect x="0" y="0" width="332" height="6" rx="3" fill="#3B82F6"/>
    <text class="title" x="20" y="34">3. Automated Verification Pipeline</text>
    <rect class="tag-blue" x="20" y="48" width="235" height="24" rx="12"/>
    <text class="tag-blue-txt" x="32" y="64">5-STAGE CONSENSUS &amp; SANITY CHECK</text>
    <text class="body" x="20" y="98">1. Operator Provenance: Only known wallet</text>
    <text class="body" x="20" y="118">   teams &amp; vetted community operators.</text>
    <text class="body" x="20" y="144">2. Consensus Hash Check: Cross-verifies</text>
    <text class="body" x="20" y="164">   top_block_hash &amp; cumulative difficulty.</text>
    <text class="body" x="20" y="190">3. Fee Sanity Check: Queries get_fee_estimate</text>
    <text class="body" x="20" y="210">   and rejects nodes with anomalous fees.</text>
    <text class="body" x="20" y="236">4. Restricted RPC &amp; TLS Audit: Verifies</text>
    <text class="body" x="20" y="256">   restricted=true, valid CA TLS, and CORS.</text>
  </g>
</svg>
