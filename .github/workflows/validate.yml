name: Validate RPC Dataset and Assets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify README.md and data/nodes.json are synchronized with data/nodes.yaml
        run: git diff --exit-code README.md data/nodes.json
